<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="rangoliGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#78350F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldPetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="40%" stop-color="#FCD34D"/>
      <stop offset="80%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
  </defs>

  <!-- Background Aura -->
  <circle cx="100" cy="100" r="95" fill="url(#rangoliGlow)"/>

  <!-- Concentric Rings -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#goldPetal)" stroke-width="1.5" stroke-dasharray="4,4"/>
  <circle cx="100" cy="100" r="75" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="100" cy="100" r="55" fill="none" stroke="#FDE68A" stroke-width="1.2"/>

  <!-- 8 Lotus Petals -->
  <g fill="url(#goldPetal)" opacity="0.85">
    <!-- Petal 1 -->
    <path d="M100 25 C92 45 92 65 100 75 C108 65 108 45 100 25 Z"/>
    <!-- Petal 2 -->
    <path d="M100 25 C92 45 92 65 100 75 C108 65 108 45 100 25 Z" transform="rotate(45 100 100)"/>
    <!-- Petal 3 -->
    <path d="M100 25 C92 45 92 65 100 75 C108 65 108 45 100 25 Z" transform="rotate(90 100 100)"/>
    <!-- Petal 4 -->
    <path d="M100 25 C92 45 92 65 100 75 C108 65 108 45 100 25 Z" transform="rotate(135 100 100)"/>
    <!-- Petal 5 -->
    <path d="M100 25 C92 45 92 65 100 75 C108 65 108 45 100 25 Z" transform="rotate(180 100 100)"/>
    <!-- Petal 6 -->
    <path d="M100 25 C92 45 92 65 100 75 C108 65 108 45 100 25 Z" transform="rotate(225 100 100)"/>
    <!-- Petal 7 -->
    <path d="M100 25 C92 45 92 65 100 75 C108 65 108 45 100 25 Z" transform="rotate(270 100 100)"/>
    <!-- Petal 8 -->
    <path d="M100 25 C92 45 92 65 100 75 C108 65 108 45 100 25 Z" transform="rotate(315 100 100)"/>
  </g>

  <!-- Central Auspicious Swastik -->
  <g fill="none" stroke="#FFFBEB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Vertical and Horizontal Center -->
    <line x1="100" y1="82" x2="100" y2="118"/>
    <line x1="82" y1="100" x2="118" y2="100"/>
    <!-- Arms -->
    <line x1="100" y1="82" x2="116" y2="82"/>
    <line x1="118" y1="100" x2="118" y2="116"/>
    <line x1="100" y1="118" x2="84" y2="118"/>
    <line x1="82" y1="100" x2="82" y2="84"/>
  </g>
  <!-- 4 auspicious bindus -->
  <circle cx="91" cy="91" r="2.5" fill="#FDE68A"/>
  <circle cx="109" cy="91" r="2.5" fill="#FDE68A"/>
  <circle cx="91" cy="109" r="2.5" fill="#FDE68A"/>
  <circle cx="109" cy="109" r="2.5" fill="#FDE68A"/>
</svg>

