<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="kalashGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#78350F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldPot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="30%" stop-color="#FDE68A"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="coconutGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="70%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#270e02"/>
    </linearGradient>
    <linearGradient id="mangoLeaf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="50%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <filter id="kalashShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Aura -->
  <circle cx="80" cy="80" r="70" fill="url(#kalashGlow)"/>

  <!-- Mango Leaves (5 Leaves spreading out) -->
  <g filter="url(#kalashShadow)">
    <!-- Center Leaf -->
    <path d="M80 30 C74 45 74 62 80 72 C86 62 86 45 80 30 Z" fill="url(#mangoLeaf)"/>
    <!-- Left Leaf 1 -->
    <path d="M80 70 C70 52 55 46 45 42 C50 56 62 66 80 70 Z" fill="url(#mangoLeaf)"/>
    <!-- Right Leaf 1 -->
    <path d="M80 70 C90 52 105 46 115 42 C110 56 98 66 80 70 Z" fill="url(#mangoLeaf)"/>
    <!-- Left Leaf 2 -->
    <path d="M80 72 C66 60 48 62 36 65 C44 74 58 78 80 72 Z" fill="url(#mangoLeaf)"/>
    <!-- Right Leaf 2 -->
    <path d="M80 72 C94 60 112 62 124 65 C116 74 102 78 80 72 Z" fill="url(#mangoLeaf)"/>
  </g>

  <!-- Coconut (Shreefal) with Tilak -->
  <g filter="url(#kalashShadow)">
    <ellipse cx="80" cy="50" rx="20" ry="24" fill="url(#coconutGrad)"/>
    <!-- Coconut fibers / texture -->
    <path d="M80 26 L80 38" stroke="#a16207" stroke-width="2" stroke-linecap="round"/>
    <path d="M74 30 L76 40" stroke="#a16207" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M86 30 L84 40" stroke="#a16207" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Red Tilak and Chandal on Coconut -->
    <ellipse cx="80" cy="50" rx="4" ry="7" fill="#dc2626"/>
    <circle cx="80" cy="50" r="2" fill="#fef08a"/>
  </g>

  <!-- Kalash Pot Body -->
  <g filter="url(#kalashShadow)">
    <!-- Rim Neck -->
    <ellipse cx="80" cy="74" rx="28" ry="6" fill="url(#goldPot)"/>
    <ellipse cx="80" cy="74" rx="22" ry="4" fill="#78350F"/>
    
    <!-- Pot Belly -->
    <path d="M54 76 C46 92 44 116 60 128 C68 134 92 134 100 128 C116 116 114 92 106 76 Z" fill="url(#goldPot)"/>
    
    <!-- Red Auspicious Thread (Nadachhadi) on Neck -->
    <rect x="58" y="78" width="44" height="6" rx="3" fill="#dc2626"/>
    <line x1="68" y1="78" x2="68" y2="84" stroke="#fef08a" stroke-width="1.5"/>
    <line x1="80" y1="78" x2="80" y2="84" stroke="#fef08a" stroke-width="1.5"/>
    <line x1="92" y1="78" x2="92" y2="84" stroke="#fef08a" stroke-width="1.5"/>

    <!-- Auspicious Swastik on Kalash Belly -->
    <g stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="80" y1="92" x2="80" y2="116"/>
      <line x1="68" y1="104" x2="92" y2="104"/>
      <line x1="80" y1="92" x2="90" y2="92"/>
      <line x1="92" y1="104" x2="92" y2="114"/>
      <line x1="80" y1="116" x2="70" y2="116"/>
      <line x1="68" y1="104" x2="68" y2="94"/>
    </g>
    <!-- 4 Bindus -->
    <circle cx="74" cy="98" r="1.5" fill="#b91c1c"/>
    <circle cx="86" cy="98" r="1.5" fill="#b91c1c"/>
    <circle cx="74" cy="110" r="1.5" fill="#b91c1c"/>
    <circle cx="86" cy="110" r="1.5" fill="#b91c1c"/>

    <!-- Pot Base Stand -->
    <ellipse cx="80" cy="128" rx="22" ry="5" fill="url(#goldPot)"/>
  </g>
</svg>

