<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="goldFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="80%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="goldBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="35%" stop-color="#FCD34D"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <filter id="diyaGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Flame Aura -->
  <circle cx="60" cy="38" r="18" fill="#F59E0B" opacity="0.25" filter="url(#diyaGlow)"/>

  <!-- Flame Inner & Outer -->
  <path d="M60 16 C52 30 50 42 60 52 C70 42 68 30 60 16 Z" fill="url(#goldFlame)" filter="url(#diyaGlow)"/>
  <path d="M60 26 C55 35 55 42 60 48 C65 42 65 35 60 26 Z" fill="#FFFFFF" opacity="0.9"/>

  <!-- Diya Bowl -->
  <path d="M22 62 C26 84 50 94 60 94 C70 94 94 84 98 62 C85 68 35 68 22 62 Z" fill="url(#goldBase)"/>
  <!-- Rim -->
  <ellipse cx="60" cy="62" rx="38" ry="8" fill="#B45309" stroke="url(#goldBase)" stroke-width="2"/>
  <ellipse cx="60" cy="63" rx="32" ry="5" fill="#78350F"/>

  <!-- Base Stand -->
  <path d="M48 94 L42 104 L78 104 L72 94 Z" fill="url(#goldBase)"/>
  <ellipse cx="60" cy="104" rx="20" ry="4" fill="url(#goldBase)"/>

  <!-- Sparkling stars around -->
  <circle cx="28" cy="42" r="1.5" fill="#FDE68A"/>
  <circle cx="92" cy="42" r="1.5" fill="#FDE68A"/>
  <circle cx="20" cy="54" r="2" fill="#FDE68A"/>
  <circle cx="100" cy="54" r="2" fill="#FDE68A"/>
</svg>

