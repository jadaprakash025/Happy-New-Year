<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="champGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="35%" stop-color="#FCD34D"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="toastGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sparkles around the clinking glasses -->
  <g fill="#FFFBEB" filter="url(#toastGlow)">
    <circle cx="80" cy="40" r="3"/>
    <circle cx="86" cy="30" r="1.5"/>
    <circle cx="74" cy="32" r="2"/>
    <circle cx="80" cy="22" r="2.5"/>
    <!-- Starburst at collision point -->
    <path d="M80 34 L82 40 L88 40 L83 44 L85 50 L80 46 L75 50 L77 44 L72 40 L78 40 Z" fill="#FDE68A"/>
  </g>

  <!-- Left Flute (Tilted right) -->
  <g transform="translate(68, 80) rotate(18) translate(-68, -80)">
    <!-- Bowl -->
    <path d="M60 40 C60 70 64 88 68 95 L68 125 L58 135 L78 135 L68 125 L68 95 C72 88 76 70 76 40 Z" fill="none" stroke="url(#champGold)" stroke-width="2.5"/>
    <!-- Liquid -->
    <path d="M62 55 C62 72 65 84 68 90 C71 84 74 72 74 55 Z" fill="url(#liquidGrad)"/>
    <!-- Bubbles -->
    <circle cx="67" cy="78" r="1.5" fill="#FFFBEB"/>
    <circle cx="69" cy="68" r="1.2" fill="#FFFBEB"/>
    <circle cx="66" cy="60" r="1.8" fill="#FFFBEB"/>
    <circle cx="70" cy="52" r="1" fill="#FFFBEB"/>
  </g>

  <!-- Right Flute (Tilted left) -->
  <g transform="translate(92, 80) rotate(-18) translate(-92, -80)">
    <!-- Bowl -->
    <path d="M84 40 C84 70 88 88 92 95 L92 125 L82 135 L102 135 L92 125 L92 95 C96 88 100 70 100 40 Z" fill="none" stroke="url(#champGold)" stroke-width="2.5"/>
    <!-- Liquid -->
    <path d="M86 55 C86 72 89 84 92 90 C95 84 98 72 98 55 Z" fill="url(#liquidGrad)"/>
    <!-- Bubbles -->
    <circle cx="93" cy="78" r="1.5" fill="#FFFBEB"/>
    <circle cx="91" cy="68" r="1.2" fill="#FFFBEB"/>
    <circle cx="94" cy="60" r="1.8" fill="#FFFBEB"/>
    <circle cx="90" cy="52" r="1" fill="#FFFBEB"/>
  </g>
</svg>

