<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#181c36"/>
      <stop offset="50%" stop-color="#0a0f20"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFDF2"/>
      <stop offset="25%" stop-color="#FDE68A"/>
      <stop offset="55%" stop-color="#F59E0B"/>
      <stop offset="85%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="none" stroke="#F59E0B" stroke-width="2.5" opacity="0.6"/>
  <rect x="36" y="36" width="1128" height="558" rx="14" fill="none" stroke="#FDE68A" stroke-width="1" stroke-dasharray="6,6" opacity="0.4"/>

  <!-- Top Badge -->
  <g transform="translate(600, 80)">
    <rect x="-260" y="-24" width="520" height="48" rx="24" fill="#7F1D1D" stroke="#F59E0B" stroke-width="1.8"/>
    <text x="0" y="8" font-family="'Hind Vadodara', sans-serif" font-size="20" font-weight="700" fill="#FFFBEB" text-anchor="middle" letter-spacing="1">✨ શુભ દિપાવલી અને નૂતન વર્ષાભિનંદન ✨</text>
  </g>

  <!-- Main Headline -->
  <text x="600" y="195" font-family="'Hind Vadodara', sans-serif" font-size="68" font-weight="900" fill="url(#goldText)" text-anchor="middle" filter="url(#glow)">નૂતન વર્ષાભિનંદન</text>
  <text x="600" y="260" font-family="'Hind Vadodara', sans-serif" font-size="34" font-weight="700" fill="#FDE68A" text-anchor="middle">સાલ મુબારક • બેસતું વર્ષ</text>

  <!-- Big Vikram Samvat -->
  <text x="600" y="360" font-family="'Hind Vadodara', sans-serif" font-size="38" font-weight="700" fill="#FFFDF0" text-anchor="middle">વિક્રમ સંવત</text>
  <text x="600" y="440" font-family="'Hind Vadodara', sans-serif" font-size="95" font-weight="900" fill="url(#goldText)" text-anchor="middle" letter-spacing="6" filter="url(#glow)">૨૦૮૧</text>

  <!-- Subtitle -->
  <text x="600" y="490" font-family="'Hind Vadodara', sans-serif" font-size="20" font-weight="600" fill="#E2E8F0" text-anchor="middle">આ નવું વર્ષ તમારા જીવનમાં સુખ, શાંતિ, સમૃદ્ધિ અને સફળતા લાવે</text>

  <!-- Sender Signature -->
  <g transform="translate(600, 550)">
    <rect x="-260" y="-26" width="520" height="52" rx="26" fill="rgba(15, 23, 42, 0.9)" stroke="url(#goldText)" stroke-width="2"/>
    <text x="0" y="7" font-family="'Hind Vadodara', sans-serif" font-size="19" font-weight="600" fill="#FFFBEB" text-anchor="middle">With Best Wishes: <tspan fill="#F59E0B" font-weight="800">Jada Prakash (જાડા પ્રકાશ) ❤️</tspan></text>
  </g>
</svg>
