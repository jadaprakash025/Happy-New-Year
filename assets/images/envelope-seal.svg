<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="sealRed" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="40%" stop-color="#DC2626"/>
      <stop offset="80%" stop-color="#991B1B"/>
      <stop offset="100%" stop-color="#450A0A"/>
    </radialGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="50%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="sealShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Irregular Wax Edges -->
  <path d="M50 6 C62 5 72 10 82 18 C90 26 95 38 94 50 C93 62 88 74 79 82 C70 90 58 95 46 94 C34 93 22 86 15 76 C8 66 7 52 10 40 C13 28 22 17 33 11 C38 8 44 7 50 6 Z" fill="url(#sealRed)" filter="url(#sealShadow)"/>

  <!-- Inner Embossed Ring -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="url(#goldText)" stroke-width="1.8" opacity="0.85"/>
  <circle cx="50" cy="50" r="29" fill="none" stroke="#F59E0B" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.6"/>

  <!-- Auspicious Diya / Crown -->
  <polygon points="50,26 52,30 56,30 53,33 54,37 50,34 46,37 47,33 44,30 48,30" fill="url(#goldText)"/>

  <!-- ૨૦૮૧ Embossed Text -->
  <text x="50" y="55" font-family="'Hind Vadodara', sans-serif" font-size="16" font-weight="900" fill="url(#goldText)" text-anchor="middle" letter-spacing="1">૨૦૮૧</text>
  <text x="50" y="66" font-family="'Hind Vadodara', sans-serif" font-size="7" font-weight="700" fill="#FEE2E2" text-anchor="middle" letter-spacing="1">શુભ સંદેશ</text>
</svg>
